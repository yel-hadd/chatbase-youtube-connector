name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Config (remove agent IDs if you prefer)
      render: yaml
  - type: textarea
    id: report
    attributes:
      label: Relevant part of report.json or the logs
      description: Tokens are masked in logs, but double-check before pasting.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version and how you run it
      placeholder: '0.1.0, GitHub Action / Docker / npx'
    validations: { required: true }
