name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation first, then the solution you have in mind.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
