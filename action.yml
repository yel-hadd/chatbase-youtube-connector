name: Chatbase YouTube Sync
description: Keep a Chatbase AI agent trained on your YouTube channel, with timestamped answers.
author: use-apify.com
branding:
  icon: youtube
  color: red
inputs:
  config:
    description: Path to the config file
    default: chatbase-youtube.yaml
  full:
    description: Re-check every video (updates and deletions) instead of only adding new ones
    default: 'false'
  dry-run:
    description: Show the plan without spending or writing anything
    default: 'false'
  job:
    description: Run only this job from the config
    default: ''
  allow-mass-delete:
    description: Permit deletions above budget.maxDeletesPerRun
    default: 'false'
  version:
    description: npm version of chatbase-youtube-sync to run
    default: '0.1.0'
outputs:
  report:
    description: Path to the JSON run report
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: run
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FULL: ${{ inputs.full }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_JOB: ${{ inputs.job }}
        INPUT_MASS_DELETE: ${{ inputs.allow-mass-delete }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        args=(-c "$INPUT_CONFIG" sync --report report.json)
        [ "$INPUT_FULL" = "true" ] && args+=(--full)
        [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
        [ "$INPUT_MASS_DELETE" = "true" ] && args+=(--allow-mass-delete)
        [ -n "$INPUT_JOB" ] && args+=(--job "$INPUT_JOB")
        echo "report=report.json" >> "$GITHUB_OUTPUT"
        npx --yes "chatbase-youtube-sync@${INPUT_VERSION}" "${args[@]}"
