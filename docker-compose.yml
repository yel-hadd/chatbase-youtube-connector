services:
  chatbase-youtube-sync:
    image: ghcr.io/use-app/chatbase-youtube-connector:latest
    restart: unless-stopped
    env_file: .env            # APIFY_TOKEN, CHATBASE_API_KEY, CHATBASE_AGENT_ID, optional HEALTHCHECK_URL
    environment:
      SCHEDULE: "17 6 * * *"      # daily: new videos
      FULL_SCHEDULE: "43 4 * * 0" # weekly: full re-check
    volumes:
      - ./chatbase-youtube.yaml:/config/chatbase-youtube.yaml:ro
      - ./data:/data              # report.json and export-mode files
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
