# Starter config for one Chatbase agent fed from one YouTube channel.
# Change: the channel under `sources:` (and add playlists or videos if you like).
# Set CHATBASE_AGENT_ID in the environment, or replace the agentId value with the ID itself.
# On Chatbase Free/Hobby: add `sink: export` to the job and delete the agentId line.
# Every option: docs/configuration.md. Check this file with: chatbase-youtube-sync validate
version: 1
defaults:
  languages: [en] # caption languages, in order of preference
  machineTranslate: true # translate captions from other languages, timestamps kept
  segmentSeconds: 60 # one timestamped section about every minute
  includeShorts: false
  minDurationSec: 60
  aiFallback:
    enabled: true # AI speech-to-text for videos without captions
    maxMinutesPerRun: 120 # hard cap on AI minutes per run (cost control)
    skipLongerThanMin: 90
  budget:
    maxUsdPerRun: 5 # abort before spending if the worst case is higher
    maxNewVideosPerRun: 200
    maxDeletesPerRun: 10
    # storageLimitMb: 20     # your Chatbase plan's training limit (Standard = 20)
  prune: false # true: remove videos deleted from YouTube (full runs) or excluded in config

jobs:
  - name: academy
    agentId: ${CHATBASE_AGENT_ID}
    sources:
      - channel: '@YourChannel'
      # - playlist: "PLxxxxxxxxxxxxxxxx"
      # - video: "https://www.youtube.com/watch?v=xxxxxxxxxxx"
    filters:
      titleExclude: ['(?i)#shorts|teaser|trailer']
      # publishedAfter: "2024-01-01"
