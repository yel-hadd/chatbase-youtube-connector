# For Chatbase Free/Hobby (no API access): build upload-ready transcript files
# weekly and commit them to this repo. Then upload the files listed in
# out/<job>/CHANGES.txt via Sources -> Files in the Chatbase dashboard.
# Committing (rather than caching) keeps the state safe between weekly runs.
name: Export YouTube transcripts for Chatbase
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatbase-youtube-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: yel-hadd/chatbase-youtube-connector@v1
        with:
          config: chatbase-youtube.yaml # with `sink: export`
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit new and changed transcripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add out
          if [ -d .chatbase-youtube ]; then git add .chatbase-youtube; fi
          git diff --cached --quiet || git commit -m 'chore: update YouTube transcripts for Chatbase'
          git push
